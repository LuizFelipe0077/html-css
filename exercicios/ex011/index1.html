<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Centralizado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            height: 100vh;
            background-color: brown;
        }
        main {
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            height: 100vh;
            width: 100vw;

            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: aquamarine;
            width: 30vw;
            height: 30vh;
            border: 1px solid black;
            border-radius: 5px;


            display: flex;
            flex-flow: row wrap;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-size: 1em;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
    
</body>
</html>
